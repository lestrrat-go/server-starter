version: 2

project_name: server-starter

builds:
  - id: start_server
    main: ./cmd/start_server
    binary: start_server
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/lestrrat-go/server-starter/v2/internal/cli.version={{ .Tag }}

archives:
  - id: default
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

release:
  prerelease: auto
